    :root {

      --anchor-red: var(--rose);

      --leading-body: 1.72;
      --tracking-eyebrow: .22em;
      --space-2: 8px;
      --space-6: 24px;
      --space-8: 32px;
      --gutter: clamp(20px, 5vw, 64px);
      --container-max: 1200px;
      --motion-base: 320ms;
      --motion-slow: 640ms;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);
      --ease-flow: cubic-bezier(.33, .02, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #142A48; color: var(--white); }
    body {
      font: 400 var(--text-base)/var(--leading-body) var(--font-body);
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    .shell { width: 100%; max-width: calc(var(--container-max) + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
    .entrance, .entrance-inner { min-height: 100svh; }
    .preview-note {
      position: fixed;
      z-index: 30;
      left: 16px;
      bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      background: rgba(10, 16, 28, .72);
      color: #d7e3e7;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .preview-note a {
      padding: 6px 10px;
      border: 1px solid rgba(215, 227, 231, .4);
    }
  </style>
  <script>
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
